<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">Namid R. Stillman</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ 'now' | date: '%Y' }} Namid R. Stillman</span>
    <div class="footer-links">
      <a href="mailto:{{ site.email }}">Email</a>
      <a href="{{ site.linkedin }}" rel="me noopener">LinkedIn</a>
      <a href="{{ site.twitter }}" rel="me noopener">Twitter</a>
    </div>
  </footer>

  {% if page.animated_banner %}
    <script type="module" src="{{ '/js/banner.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
