---
layout: default
---
<article class="post">
  <header class="post-header">
    <a class="eyebrow" href="{{ '/' | relative_url }}">← Home</a>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="dek">{{ page.description }}</p>{% endif %}
    {% if page.date_published %}
      <time datetime="{{ page.date_published | date_to_xmlschema }}">{{ page.date_published | date: "%d %B %Y" }}</time>
    {% endif %}
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
